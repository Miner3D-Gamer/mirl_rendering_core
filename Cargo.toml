[package]
name = "mirl_rendering_core"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_rendering_core"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true

[features]
default = ["std"]
std = [
    "bitcode?/std",
    "mirl_buffer/std",
    "mirl_buffer_interpolation/std",
    "mirl_extensions/std",
    "mirl_graphics/std",
    "serde?/std",
    "wincode?/std",
    "zerocopy?/std",
]
all = [
    "all_codecs",
    "mirl_buffer/all",
    "mirl_extensions/all",
    "mirl_graphics/all",
]
# Compatibility with ffi
c_compatible = [
    "mirl_buffer/c_compatible",
    "mirl_buffer_interpolation/c_compatible",
    "mirl_extensions/c_compatible",
    "mirl_graphics/c_compatible",
]
# Enables all codecs
all_codecs = [
    "dep:serde",
    "dep:bitcode",
    "dep:wincode",
    "dep:compactly",
    "dep:zerocopy",
    "mirl_buffer/all_codecs",
    "mirl_buffer_interpolation/all_codecs",
    "mirl_graphics/all_codecs",
]
# # All enum extensions# all_enum_extensions = ["strum", "enum_ext"]
# Codec stuff
serde = [
    "dep:serde",
    "bitcode?/serde",
    "mirl_buffer/serde",
    "mirl_buffer_interpolation/serde",
    "mirl_graphics/serde",
]
bitcode = [
    "dep:bitcode",
    "mirl_buffer/bitcode",
    "mirl_buffer_interpolation/bitcode",
    "mirl_graphics/bitcode",
]
wincode = [
    "dep:wincode",
    "mirl_buffer/wincode",
    "mirl_buffer_interpolation/wincode",
    "mirl_graphics/wincode",
]
compactly = [
    "dep:compactly",
    "mirl_buffer/compactly",
    "mirl_buffer_interpolation/compactly",
    "mirl_graphics/compactly",
]
zerocopy = [
    "dep:zerocopy",
    "mirl_buffer/zerocopy",
    "mirl_buffer_interpolation/zerocopy",
    "mirl_graphics/zerocopy",
]
enum_ordinalize = ["dep:enum-ordinalize"]
rkyv = ["dep:rkyv"]
parity_scale_codec = ["dep:parity-scale-codec"]
get_size2 = ["dep:get-size2"]
bevy_reflect = ["dep:bevy_reflect"]
font_support = ["dep:fontdue", "dep:once_cell", "std", "dep:parking_lot"]
[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.2", optional = true }
fontdue = { version = "0.9", optional = true, default-features = false }
mirl_buffer = { version = "0.0.0-alpha" }
mirl_buffer_interpolation = { version = "0.0.0-alpha" }
mirl_macros = { version = "0.0.0-alpha" }
mirl_extensions = { version = "0.0.0-alpha" }
mirl_graphics = { version = "0.0.0-alpha" }
# typed_floats = { version = "1.0.7" }
mirl_narrowed_floats = { version = "0.0.0-alpha" }
once_cell = { version = "1.21", optional = true, default-features = false }
# TODO: Find something even faster for this application rather than this general purpose crate
parking_lot = { version = "0.12", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.6", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }

enum-ordinalize = { version = "4.4.2", optional = true }
rkyv = { version = "0.8", optional = true }
parity-scale-codec = { version = "3.7", optional = true, features = ["derive"] }
get-size2 = { version = "0.11", optional = true, features = ["derive"] }
bevy_reflect = { version = "0.20", optional = true }

[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }
[lints]
workspace = true
